    <title>누리 ❤︎ 상민 결혼합니다</title>
    <script>
      // Apply theme before first paint: saved choice wins, otherwise follow the system.
      ;(function () {
        try {
          var theme = localStorage.getItem('wedding-theme')
          if (theme !== 'dark' && theme !== 'light') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.dataset.theme = theme
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#1c1c1e' : '#ffffff')
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
